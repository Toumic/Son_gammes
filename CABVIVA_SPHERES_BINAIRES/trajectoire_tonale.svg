<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Trajectoire des tonalit&#233;s</title>
  <desc id="desc">Une trajectoire relie plusieurs &#233;tats de gammes et leurs tonalit&#233;s.</desc>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#e49b62"/></marker></defs>
  <rect width="1200" height="700" fill="#171521"/>
  <path d="M70 540 C250 170 370 590 550 260 S860 160 1110 410" fill="none" stroke="#5bd6c2" stroke-opacity=".25" stroke-width="18"/>
  <path d="M70 540 C250 170 370 590 550 260 S860 160 1110 410" fill="none" stroke="#e49b62" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="80" y="85" fill="#f4ead5" font-family="Georgia,serif" font-size="38">La tonalite comme trajectoire</text>
  <text x="82" y="125" fill="#bdb6c7" font-family="Arial,sans-serif" font-size="18">Une structure stable, des etats successifs, des transitions</text>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <g fill="#f4ead5" stroke="#5bd6c2" stroke-width="5"><circle cx="110" cy="500" r="48"/><circle cx="330" cy="290" r="48"/><circle cx="550" cy="445" r="48"/><circle cx="770" cy="215" r="48"/><circle cx="1070" cy="370" r="48"/></g>
    <g fill="#171521" font-size="24"><text x="110" y="508">Do</text><text x="330" y="298">Sol</text><text x="550" y="453">Re</text><text x="770" y="223">La</text><text x="1070" y="378">Do</text></g>
    <g fill="#e49b62" font-size="16"><text x="110" y="580">reference</text><text x="330" y="370">transition</text><text x="550" y="525">correspondance</text><text x="770" y="295">variation</text><text x="1070" y="450">retour</text></g>
  </g>
  <text x="80" y="635" fill="#f4ead5" font-family="Georgia,serif" font-size="24">La tonalite devient un mouvement calculable et audible.</text>
</svg>
